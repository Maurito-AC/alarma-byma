name: Golden Cross Scanner - Jueves
on:
  workflow_dispatch:
  repository_dispatch:
    types: [golden-cross-jueves-trigger]
  schedule:
    # Respaldo nativo por si el disparo externo llegara a fallar.
    # 9:07 UTC = 06:07 ART, solo jueves.
    - cron: '7 9 * * 4'
jobs:
  golden-cross:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar si ya corrio hoy con exito (cualquier disparo)
        id: chequeo
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOY=$(date -u +%Y-%m-%d)
          EXITOSAS=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "golden-cross-jueves.yml" \
            --status success \
            --json createdAt,event \
            --jq "[.[] | select(.createdAt | startswith(\"$HOY\")) | select(.event == \"schedule\" or .event == \"repository_dispatch\")] | length")
          echo "Corridas exitosas hoy ($HOY): $EXITOSAS"
          if [ "$EXITOSAS" -gt "0" ]; then
            echo "Ya corrio bien hoy, se salta esta corrida."
            echo "saltar=true" >> "$GITHUB_OUTPUT"
          else
            echo "saltar=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout del repo
        if: steps.chequeo.outputs.saltar != 'true'
        uses: actions/checkout@v4
      - name: Configurar Python
        if: steps.chequeo.outputs.saltar != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        if: steps.chequeo.outputs.saltar != 'true'
        run: pip install yfinance pandas
      - name: Ejecutar escáner de Golden Cross
        if: steps.chequeo.outputs.saltar != 'true'
        env:
          EMAIL_SENDER: ${{ secrets.GMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.TO_EMAIL }}
        run: python golden_cross_scanner.py
