# Guardar este archivo en: .github/workflows/alerta-premercado.yml
name: Alerta Pre-Mercado
on:
  repository_dispatch:
    types: [premercado-trigger]
  schedule:
    # Horario principal: 11:35 UTC = 8:35 hs Argentina (respaldo del disparo externo)
    - cron: "35 11 * * 1-5"
    # Horario de respaldo: 12:00 UTC = 9:00 hs Argentina.
    # Solo se ejecuta de verdad si nadie corrio con exito hoy todavia
    # (ni el disparo externo de cron-job.org ni el horario principal).
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}   # permite ejecutarlo a mano tambien
permissions:
  actions: read
  contents: read
jobs:
  chequear-premercado:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar si ya corrio hoy con exito
        id: chequeo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOY=$(date -u +%Y-%m-%d)
          EXITOSAS=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "alerta-premercado.yml" \
            --status success \
            --json createdAt,event \
            --jq "[.[] | select(.createdAt | startswith(\"$HOY\")) | select(.event == \"schedule\" or .event == \"repository_dispatch\")] | length")
          echo "Corridas exitosas hoy ($HOY): $EXITOSAS"
          if [ "$EXITOSAS" -gt "0" ]; then
            echo "Ya corrio bien hoy (disparo externo o schedule), se salta esta corrida."
            echo "saltar=true" >> "$GITHUB_OUTPUT"
          else
            echo "saltar=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Clonar repo
        if: steps.chequeo.outputs.saltar != 'true'
        uses: actions/checkout@v4
      - name: Configurar Python
        if: steps.chequeo.outputs.saltar != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        if: steps.chequeo.outputs.saltar != 'true'
        run: pip install -r requirements.txt
      - name: Ejecutar alerta de pre-mercado
        if: steps.chequeo.outputs.saltar != 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python alerta_premercado.py
