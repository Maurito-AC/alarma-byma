# Guardar este archivo en: .github/workflows/alerta-eeuu.yml
name: Alerta de precios EEUU
on:
  repository_dispatch:
    types: [eeuu-trigger]
  schedule:
    # Corre 3 veces por dia, de lunes a viernes, horario Argentina (UTC-3):
    # 10:32 ART = 13:32 UTC
    # 12:08 ART = 15:08 UTC
    # 16:18 ART = 19:18 UTC
    - cron: "32 13 * * 1-5"
    - cron: "8 15 * * 1-5"
    - cron: "18 19 * * 1-5"
  workflow_dispatch: {}   # permite tambien ejecutarlo a mano desde GitHub
jobs:
  chequear-precios:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar alerta
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python alerta_eeuu.py
