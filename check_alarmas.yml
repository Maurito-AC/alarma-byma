name: .github/workflows/check_alarmas.yml

on:
  # Corre cada 30 minutos de lunes a viernes
  # Horario BYMA: 11:00 a 17:00 hs ARG = 14:00 a 20:00 UTC
  # Se agrega margen: empieza 13:30 UTC (10:30 ARG) y termina 20:30 UTC (17:30 ARG)
  schedule:
    - cron: "*/30 13-20 * * 1-5"

  # Botón manual desde la pestaña Actions de GitHub (útil para probar)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance

      - name: Correr el checker
        run: python checker.py
        env:
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:  ${{ secrets.GMAIL_APP_PASS }}
          RECEIVER_EMAIL:  ${{ secrets.RECEIVER_EMAIL }}
